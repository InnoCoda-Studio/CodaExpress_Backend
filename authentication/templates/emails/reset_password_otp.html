<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset OTP</title>
</head>
<body style="margin: 0; padding: 0; background-color: #090D16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #F8FAFC;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #090D16; padding: 40px 10px;">
    <tr>
      <td align="center">
        <!-- Main Card Container -->
        <table role="presentation" width="100%" style="max-width: 480px; background-color: #1E293B; border-radius: 16px; border: 1px solid #334155; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);">
          
          <!-- Header Branding -->
          <tr>
            <td align="center" style="padding-bottom: 24px;">
              <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #E11D48; letter-spacing: -0.5px;">
                Password Reset
              </h1>
            </td>
          </tr>

          <!-- Message Body -->
          <tr>
            <td style="color: #94A3B8; font-size: 15px; line-height: 1.6; text-align: center; padding-bottom: 28px;">
              You requested to reset your password. Use the verification code below to complete the process. This code expires in <strong style="color: #F8FAFC;">10 minutes</strong>.
            </td>
          </tr>

          <!-- OTP Code Display -->
          <tr>
            <td align="center" style="padding-bottom: 28px;">
              <div style="background-color: #FFE4E6; border: 2px dashed #E11D48; border-radius: 12px; padding: 18px 24px; display: inline-block;">
                <span style="font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; letter-spacing: 10px; color: #BE123C;">
                  {{ otp_code }}
                </span>
              </div>
            </td>
          </tr>

          <!-- Security Notice -->
          <tr>
            <td style="color: #64748B; font-size: 13px; text-align: center; line-height: 1.5; border-top: 1px solid #334155; padding-top: 20px;">
              If you did not request a password reset, please ignore this email or contact support if you have concerns.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
